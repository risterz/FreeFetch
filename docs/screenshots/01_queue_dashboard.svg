<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Titlebar -->
  <rect x="0" y="0" width="1200" height="40" fill="#090d16" />
  <circle cx="20" cy="20" r="6" fill="#ef4444" />
  <circle cx="40" cy="20" r="6" fill="#f59e0b" />
  <circle cx="60" cy="20" r="6" fill="#10b981" />
  <text x="600" y="25" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">FreeFetch v0.1.0 — Desktop Media Downloader</text>

  <!-- App Header -->
  <rect x="0" y="40" width="1200" height="74" fill="#1e293b" border-bottom="1px solid #334155" />
  <g transform="translate(32, 54)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#headerGrad)" />
    <path d="M23 12 v16 M16 21 l7 7 l7 -7 M14 34 h18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="58" y="24" fill="#f8fafc" font-size="20" font-weight="700">FreeFetch</text>
    <rect x="156" y="8" width="56" height="20" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <text x="184" y="22" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">v0.1 BETA</text>
    <text x="58" y="40" fill="#94a3b8" font-size="12">Clean-room High-Fidelity Desktop Downloader</text>
  </g>

  <!-- Sidecar Badges -->
  <g transform="translate(930, 62)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="70" y="18" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">FFmpeg Ready</text>

    <rect x="140" y="0" width="98" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <circle cx="154" cy="14" r="4" fill="#10b981" />
    <text x="194" y="18" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">yt-dlp Active</text>
  </g>

  <!-- Tab Navigation -->
  <g transform="translate(32, 126)">
    <rect x="0" y="0" width="130" height="38" rx="10" fill="#059669" />
    <text x="65" y="24" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Queue (3)</text>

    <rect x="140" y="0" width="120" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="200" y="24" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">History (142)</text>

    <rect x="270" y="0" width="110" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="325" y="24" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Settings</text>
  </g>

  <!-- URL Bar -->
  <g transform="translate(32, 178)">
    <rect x="0" y="0" width="970" height="46" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" fill="#64748b" font-size="14">https://www.youtube.com/watch?v=dQw4w9WgXcQ</text>

    <rect x="984" y="0" width="152" height="46" rx="12" fill="url(#headerGrad)" />
    <text x="1060" y="28" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Analyze Media</text>
  </g>

  <!-- Global Stats Bar -->
  <g transform="translate(32, 238)">
    <rect x="0" y="0" width="1136" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="31" fill="#94a3b8" font-size="13">Active Downloads: <tspan fill="#f8fafc" font-weight="700">2 / 3</tspan></text>
    <text x="240" y="31" fill="#94a3b8" font-size="13">Total Throughput: <tspan fill="#10b981" font-weight="700">18.4 MB/s</tspan></text>
    <text x="490" y="31" fill="#94a3b8" font-size="13">Completed: <tspan fill="#f8fafc" font-weight="700">1</tspan></text>
    <text x="680" y="31" fill="#94a3b8" font-size="13">Queue Progress: <tspan fill="#f8fafc" font-weight="700">68%</tspan></text>
    <rect x="830" y="21" width="280" height="10" rx="5" fill="#334155" />
    <rect x="830" y="21" width="190" height="10" rx="5" fill="url(#progGrad)" />
  </g>

  <!-- Card 1: 4K YouTube Video (Downloading) -->
  <g transform="translate(32, 306)" filter="url(#shadow)">
    <rect x="0" y="0" width="1136" height="136" rx="14" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5" />
    <rect x="18" y="18" width="176" height="100" rx="8" fill="#0f172a" />
    <text x="106" y="73" fill="#64748b" font-size="13" text-anchor="middle">4K UHD Video</text>
    <rect x="24" y="24" width="42" height="20" rx="4" fill="#059669" />
    <text x="45" y="38" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">2160p</text>

    <!-- Details -->
    <text x="212" y="44" fill="#f8fafc" font-size="16" font-weight="600">Rick Astley - Never Gonna Give You Up (Official Video) [4K Remaster]</text>
    <text x="212" y="68" fill="#94a3b8" font-size="12">YouTube • MP4 (AV1 + Opus) • Subtitles: English [Soft] • Total: 412.5 MB</text>

    <!-- Progress Bar -->
    <rect x="212" y="86" width="680" height="10" rx="5" fill="#334155" />
    <rect x="212" y="86" width="460" height="10" rx="5" fill="url(#progGrad)" />

    <text x="212" y="114" fill="#10b981" font-size="12" font-weight="600">68% • 280.5 / 412.5 MB</text>
    <text x="420" y="114" fill="#94a3b8" font-size="12">Speed: <tspan fill="#34d399" font-weight="600">14.2 MB/s</tspan></text>
    <text x="600" y="114" fill="#94a3b8" font-size="12">ETA: <tspan fill="#f8fafc" font-weight="500">9s</tspan> (16 Chunks Parallel)</text>

    <!-- Buttons -->
    <rect x="940" y="48" width="84" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="982" y="72" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Pause</text>
    <rect x="1034" y="48" width="84" height="38" rx="8" fill="#450a0a" stroke="#991b1b" stroke-width="1" />
    <text x="1076" y="72" fill="#fca5a5" font-size="12" font-weight="600" text-anchor="middle">Cancel</text>
  </g>

  <!-- Card 2: TikTok HD Short (Completed) -->
  <g transform="translate(32, 458)" filter="url(#shadow)">
    <rect x="0" y="0" width="1136" height="136" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect x="18" y="18" width="176" height="100" rx="8" fill="#0f172a" />
    <text x="106" y="73" fill="#64748b" font-size="13" text-anchor="middle">TikTok Video</text>
    <rect x="24" y="24" width="42" height="20" rx="4" fill="#0284c7" />
    <text x="45" y="38" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">1080p</text>

    <!-- Details -->
    <text x="212" y="44" fill="#f8fafc" font-size="16" font-weight="600">Viral Choreography Performance 2026</text>
    <text x="212" y="68" fill="#94a3b8" font-size="12">TikTok • MP4 (H.264 + AAC) • Total: 28.4 MB • Completed in 1.8s</text>

    <!-- Progress Bar -->
    <rect x="212" y="86" width="680" height="10" rx="5" fill="#10b981" />
    <text x="212" y="114" fill="#34d399" font-size="12" font-weight="600">100% Completed • Verified Integrity</text>

    <!-- Buttons -->
    <rect x="914" y="48" width="100" height="38" rx="8" fill="#065f46" stroke="#059669" stroke-width="1" />
    <text x="964" y="72" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Open File</text>
    <rect x="1022" y="48" width="96" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="1070" y="72" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Folder</text>
  </g>

  <!-- Card 3: Google Drive Large File (Downloading) -->
  <g transform="translate(32, 610)" filter="url(#shadow)">
    <rect x="0" y="0" width="1136" height="136" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect x="18" y="18" width="176" height="100" rx="8" fill="#0f172a" />
    <text x="106" y="73" fill="#64748b" font-size="13" text-anchor="middle">Google Drive</text>
    <rect x="24" y="24" width="42" height="20" rx="4" fill="#eab308" />
    <text x="45" y="38" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">DOCS</text>

    <!-- Details -->
    <text x="212" y="44" fill="#f8fafc" font-size="16" font-weight="600">OpenData_Dataset_Archive_2026.zip</text>
    <text x="212" y="68" fill="#94a3b8" font-size="12">Google Drive Direct • 1.2 GB • 16-Segment Resumable HTTP Chunk Downloader</text>

    <!-- Progress Bar -->
    <rect x="212" y="86" width="680" height="10" rx="5" fill="#334155" />
    <rect x="212" y="86" width="220" height="10" rx="5" fill="url(#progGrad)" />

    <text x="212" y="114" fill="#10b981" font-size="12" font-weight="600">32% • 384 MB / 1.2 GB</text>
    <text x="420" y="114" fill="#94a3b8" font-size="12">Speed: <tspan fill="#34d399" font-weight="600">16.8 MB/s</tspan></text>
    <text x="600" y="114" fill="#94a3b8" font-size="12">ETA: <tspan fill="#f8fafc" font-weight="500">48s</tspan></text>

    <!-- Buttons -->
    <rect x="940" y="48" width="84" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="982" y="72" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Pause</text>
    <rect x="1034" y="48" width="84" height="38" rx="8" fill="#450a0a" stroke="#991b1b" stroke-width="1" />
    <text x="1076" y="72" fill="#fca5a5" font-size="12" font-weight="600" text-anchor="middle">Cancel</text>
  </g>
</svg>
