<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#0b1120; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Dimmed Background -->
  <rect x="0" y="0" width="1200" height="780" fill="#020617" opacity="0.82" />

  <!-- Format Picker Modal Box -->
  <g transform="translate(180, 50)" filter="url(#modalShadow)">
    <rect x="0" y="0" width="840" height="680" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Modal Header -->
    <g transform="translate(32, 28)">
      <text x="0" y="20" fill="#f8fafc" font-size="20" font-weight="700">Select Format &amp; Quality</text>
      <text x="0" y="42" fill="#94a3b8" font-size="13">Resolved 27 playable streams and 6 subtitle tracks</text>
      <!-- Close button -->
      <circle cx="776" cy="18" r="14" fill="#334155" />
      <path d="M771 13 l10 10 M781 13 l-10 10" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Video Metadata Card -->
    <g transform="translate(32, 88)">
      <rect x="0" y="0" width="776" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="12" y="12" width="116" height="66" rx="6" fill="#1e293b" />
      <text x="70" y="48" fill="#64748b" font-size="11" text-anchor="middle">Thumbnail</text>
      <text x="144" y="34" fill="#f8fafc" font-size="15" font-weight="600">Rick Astley - Never Gonna Give You Up (Official Video)</text>
      <text x="144" y="56" fill="#94a3b8" font-size="12">Uploader: <tspan fill="#e2e8f0" font-weight="500">Rick Astley</tspan> • Duration: <tspan fill="#e2e8f0" font-weight="500">03:32</tspan> • Service: <tspan fill="#10b981" font-weight="600">YouTube</tspan></text>
      <text x="144" y="74" fill="#38bdf8" font-size="11">https://www.youtube.com/watch?v=dQw4w9WgXcQ</text>
    </g>

    <!-- Format Tabs -->
    <g transform="translate(32, 196)">
      <rect x="0" y="0" width="240" height="34" rx="8" fill="#059669" />
      <text x="120" y="22" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Video + Audio (Adaptive Mux)</text>

      <rect x="250" y="0" width="130" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="315" y="22" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">Video Only</text>

      <rect x="390" y="0" width="130" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="455" y="22" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">Audio Only (MP3/M4A)</text>
    </g>

    <!-- Stream Picker Table -->
    <g transform="translate(32, 246)">
      <!-- Row 1: Selected (4K) -->
      <rect x="0" y="0" width="776" height="54" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="28" cy="27" r="8" fill="#10b981" />
      <circle cx="28" cy="27" r="4" fill="#ffffff" />
      <text x="52" y="32" fill="#ffffff" font-size="14" font-weight="700">4K UHD (2160p60)</text>
      <text x="240" y="32" fill="#a7f3d0" font-size="12">Codec: <tspan font-weight="600">AV1 / VP9</tspan></text>
      <text x="380" y="32" fill="#a7f3d0" font-size="12">Audio: <tspan font-weight="600">Opus 160kbps</tspan></text>
      <text x="560" y="32" fill="#a7f3d0" font-size="12">Container: <tspan font-weight="600">MP4 / MKV</tspan></text>
      <text x="730" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="end">412 MB</text>

      <!-- Row 2: 1440p -->
      <rect x="0" y="60" width="776" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="85" r="8" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="52" y="90" fill="#f8fafc" font-size="13" font-weight="600">QHD (1440p60)</text>
      <text x="240" y="90" fill="#94a3b8" font-size="12">Codec: VP9</text>
      <text x="380" y="90" fill="#94a3b8" font-size="12">Audio: Opus 160kbps</text>
      <text x="560" y="90" fill="#94a3b8" font-size="12">Container: MP4</text>
      <text x="730" y="90" fill="#cbd5e1" font-size="13" text-anchor="end">225 MB</text>

      <!-- Row 3: 1080p FHD -->
      <rect x="0" y="116" width="776" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="141" r="8" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="52" y="146" fill="#f8fafc" font-size="13" font-weight="600">Full HD (1080p60)</text>
      <text x="240" y="146" fill="#94a3b8" font-size="12">Codec: H.264 (AVC1)</text>
      <text x="380" y="146" fill="#94a3b8" font-size="12">Audio: AAC 128kbps</text>
      <text x="560" y="146" fill="#94a3b8" font-size="12">Container: MP4</text>
      <text x="730" y="146" fill="#cbd5e1" font-size="13" text-anchor="end">94 MB</text>
    </g>

    <!-- Subtitles Options Box -->
    <g transform="translate(32, 432)">
      <rect x="0" y="0" width="776" height="136" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" fill="#f8fafc" font-size="13" font-weight="600">Subtitle Configuration</text>

      <!-- Subtitle tracks -->
      <text x="20" y="58" fill="#94a3b8" font-size="12">Available Tracks (Originals Preserved):</text>
      <rect x="20" y="70" width="130" height="28" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1" />
      <text x="85" y="88" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">English (Manual) ✓</text>

      <rect x="158" y="70" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="228" y="88" fill="#cbd5e1" font-size="11" text-anchor="middle">English (Auto-Orig)</text>

      <rect x="306" y="70" width="120" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="366" y="88" fill="#cbd5e1" font-size="11" text-anchor="middle">Spanish (Manual)</text>

      <!-- Processing Mode -->
      <text x="470" y="58" fill="#94a3b8" font-size="12">Processing Mode:</text>
      <rect x="470" y="70" width="140" height="28" rx="6" fill="#059669" />
      <text x="540" y="88" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Soft Embed (mov_text)</text>

      <rect x="618" y="70" width="138" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="687" y="88" fill="#cbd5e1" font-size="11" text-anchor="middle">Hardcode (Burned)</text>

      <text x="20" y="122" fill="#64748b" font-size="11">Machine-translated spam tracks (&amp;tlang=) automatically filtered out by clean-room parser.</text>
    </g>

    <!-- Footer Actions -->
    <g transform="translate(32, 592)">
      <rect x="0" y="0" width="150" height="48" rx="10" fill="#334155" />
      <text x="75" y="30" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>

      <rect x="476" y="0" width="140" height="48" rx="10" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
      <text x="546" y="30" fill="#10b981" font-size="13" font-weight="600" text-anchor="middle">Add to Queue</text>

      <rect x="626" y="0" width="150" height="48" rx="10" fill="url(#headerGrad)" />
      <text x="701" y="30" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Download Now</text>
    </g>
  </g>
</svg>
