<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Consolas','Fira Code','Courier New',monospace;">
  <defs>
